<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Sosial - XI RPL 2</title>
    <link rel="icon" href="medsos/logorplbulat.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-in-up {
        animation: fadeInUp 0.6s ease-out forwards;
      }

      .delay-1 {
        animation-delay: 0.1s;
        opacity: 0;
      }
      .delay-2 {
        animation-delay: 0.2s;
        opacity: 0;
      }
      .delay-3 {
        animation-delay: 0.3s;
        opacity: 0;
      }
      .delay-4 {
        animation-delay: 0.4s;
        opacity: 0;
      }
    </style>
  </head>
  <body
    class="bg-[#040a18] min-h-screen flex flex-col items-center justify-center px-4 py-12"
  >
    <!-- Header -->
    <div class="text-center mb-12 fade-in-up">
      <h1 class="text-4xl md:text-5xl font-bold text-[#e5f5f9] mb-4">
        Ikuti Kami
      </h1>
      <p class="text-[#e5f5f9] text-lg md:text-xl opacity-80">
        Kunjungi media sosial kelas XI RPL 2
      </p>
    </div>

    <!-- Social Media Links Container -->
    <div class="w-full max-w-md space-y-4 mb-12">
      <!-- Instagram -->
      <a
      rel="noopener noreferrer"
        href="https://www.instagram.com/webdeveloptwo?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
        target="_blank"
        class="fade-in-up delay-1 flex items-center bg-white/10 hover:bg-gradient-to-r hover:from-purple-600 hover:via-pink-600 hover:to-orange-500 backdrop-blur-sm rounded-xl p-6 shadow-lg transform hover:scale-105 transition-all duration-300 group"
      >
        <div
          class="flex items-center justify-center w-16 h-16 bg-gradient-to-br from-purple-600 via-pink-600 to-orange-500 rounded-full mr-5 group-hover:rotate-12 transition-transform duration-300"
        >
          <img src="medsos/instagram.png" alt="Instagram" class="w-10 h-10" />
        </div>
        <div class="flex-1">
          <h3 class="text-white text-2xl font-bold">Instagram</h3>
          <p
            class="text-white/70 text-sm group-hover:text-white/90 transition-colors"
          >
            @webdeveloptwo
          </p>
        </div>
        <svg
          class="w-6 h-6 text-white opacity-50 group-hover:opacity-100 group-hover:translate-x-2 transition-all"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5l7 7-7 7"
          ></path>
        </svg>
      </a>

      <!-- TikTok -->
      <a
        href="#"
        class="fade-in-up delay-2 flex items-center bg-white/10 hover:bg-gradient-to-r hover:from-black hover:to-cyan-500 backdrop-blur-sm rounded-xl p-6 shadow-lg transform hover:scale-105 transition-all duration-300 group"
      >
        <div
          class="flex items-center justify-center w-16 h-16 bg-gradient-to-br from-black to-cyan-500 rounded-full mr-5 group-hover:rotate-12 transition-transform duration-300"
        >
          <img src="medsos/tiktok.png" alt="TikTok" class="w-9 h-9" />
        </div>
        <div class="flex-1">
          <h3 class="text-white text-2xl font-bold">TikTok</h3>
          <p
            class="text-white/70 text-sm group-hover:text-white/90 transition-colors"
          >
            Segera hadir
          </p>
        </div>
        <svg
          class="w-6 h-6 text-white opacity-50 group-hover:opacity-100 group-hover:translate-x-2 transition-all"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5l7 7-7 7"
          ></path>
        </svg>
      </a>

      <!-- YouTube -->
      <a
      rel="noopener noreferrer"
        href="https://www.youtube.com/@X-PPLG2"
        target="_blank"
        class="fade-in-up delay-3 flex items-center bg-white/10 hover:bg-gradient-to-r hover:from-red-600 hover:to-red-500 backdrop-blur-sm rounded-xl p-6 shadow-lg transform hover:scale-105 transition-all duration-300 group"
      >
        <div
          class="flex items-center justify-center w-16 h-16 bg-gradient-to-br from-red-600 to-red-500 rounded-full mr-5 group-hover:rotate-12 transition-transform duration-300"
        >
          <img src="medsos/youtube.png" alt="YouTube" class="w-12 h-8" />
        </div>
        <div class="flex-1">
          <h3 class="text-white text-2xl font-bold">YouTube</h3>
          <p
            class="text-white/70 text-sm group-hover:text-white/90 transition-colors"
          >
            @X-PPLG2
          </p>
        </div>
        <svg
          class="w-6 h-6 text-white opacity-50 group-hover:opacity-100 group-hover:translate-x-2 transition-all"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5l7 7-7 7"
          ></path>
        </svg>
      </a>

      <!-- Spotify -->
      <a
      rel="noopener noreferrer"
        href="https://open.spotify.com/playlist/63G4keadcF7v0iTB0zkdAV?si=9d3ad5c6e1154cbd"
        target="_blank"
        class="fade-in-up delay-4 flex items-center bg-white/10 hover:bg-gradient-to-r hover:from-green-600 hover:to-green-500 backdrop-blur-sm rounded-xl p-6 shadow-lg transform hover:scale-105 transition-all duration-300 group"
      >
        <div
          class="flex items-center justify-center w-16 h-16 bg-gradient-to-br from-green-600 to-green-500 rounded-full mr-5 group-hover:rotate-12 transition-transform duration-300"
        >
          <img src="medsos/spotify.png" alt="Spotify" class="w-9 h-9" />
        </div>
        <div class="flex-1">
          <h3 class="text-white text-2xl font-bold">Spotify</h3>
          <p
            class="text-white/70 text-sm group-hover:text-white/90 transition-colors"
          >
            Playlist Kelas
          </p>
        </div>
        <svg
          class="w-6 h-6 text-white opacity-50 group-hover:opacity-100 group-hover:translate-x-2 transition-all"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5l7 7-7 7"
          ></path>
        </svg>
      </a>
    </div>

    <!-- Back Button -->
    <a
      href="index.html"
      class="fade-in-up delay-4 bg-[#ff6a3d] hover:bg-[#e55a2d] text-white font-bold px-8 py-3 rounded-full shadow-lg transform hover:scale-105 transition-all duration-300 flex items-center gap-2"
    >
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 19l-7-7m0 0l7-7m-7 7h18"
        ></path>
      </svg>
      Kembali ke Beranda
    </a>

    <!-- Footer -->
    <footer class="mt-16 text-center text-[#e5f5f9]/50 text-sm">
      <p>&copy; 2023 XI RPL 2 - SMKN 5 TELKOM</p>
    </footer>
  </body>
</html>
